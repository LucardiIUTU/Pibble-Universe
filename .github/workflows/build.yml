name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Crear proyecto Android
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/pibble/universe app/src/main/res/values app/src/main/res/drawable
          cp "$(ls *.html | head -1)" app/src/main/assets/index.html
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PibbleUniverse"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          printf 'org.gradle.jvmargs=-Xmx3g\nandroid.useAndroidX=true\n' > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pibble.universe"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.pibble.universe"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 54
                  versionName = "54"
              }
              androidResources { noCompress += listOf("html", "glb") }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.webkit:webkit:1.11.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="Pibble Universe"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.Pibble">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Pibble" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1A3A6E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFD700" android:pathData="M54,54m-26,0a26,26 0,1 1,52 0a26,26 0,1 1,-52 0"/>
              <path android:fillColor="#FF6B00" android:pathData="M44,46m-4,0a4,4 0,1 1,8 0a4,4 0,1 1,-8 0"/>
              <path android:fillColor="#FF6B00" android:pathData="M64,46m-4,0a4,4 0,1 1,8 0a4,4 0,1 1,-8 0"/>
          </vector>
          EOF
          cat > app/src/main/java/com/pibble/universe/MainActivity.kt <<'EOF'
          package com.pibble.universe

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : AppCompatActivity() {
              private lateinit var web: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  web = WebView(this).apply { setBackgroundColor(Color.BLACK) }
                  setContentView(web)
                  hideBars()
                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()
                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                      useWideViewPort = true
                      loadWithOverviewMode = true
                  }
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest): WebResourceResponse? =
                          loader.shouldInterceptRequest(r.url)
                  }
                  web.webChromeClient = WebChromeClient()
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() { moveTaskToBack(true) }
                  })
                  if (savedInstanceState == null)
                      web.loadUrl("https://appassets.androidplatform.net/assets/index.html")
                  else web.restoreState(savedInstanceState)
              }

              private fun hideBars() {
                  val c = WindowInsetsControllerCompat(window, window.decorView)
                  c.hide(WindowInsetsCompat.Type.systemBars())
                  c.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }
              override fun onWindowFocusChanged(hasFocus: Boolean) { super.onWindowFocusChanged(hasFocus); if (hasFocus) hideBars() }
              override fun onResume() { super.onResume(); web.onResume() }
              override fun onPause() { web.onPause(); super.onPause() }
              override fun onSaveInstanceState(o: Bundle) { super.onSaveInstanceState(o); web.saveState(o) }
              override fun onDestroy() { web.destroy(); super.onDestroy() }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PibbleUniverse-apk
          path: app/build/outputs/apk/debug/app-debug.apk
